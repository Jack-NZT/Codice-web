<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0c">
    <meta name="color-scheme" content="dark light">

    <title>Explorar — Códice</title>

    <link rel="stylesheet" href="css/estilo.css">
    <script>
    (function () {
        try {
            var tema = localStorage.getItem("codice-theme");

            if (tema === "light") {
                document.documentElement.setAttribute("data-theme", "light");

                var meta = document.querySelector('meta[name="theme-color"]');

                if (meta) {
                    meta.setAttribute("content", "#f7f4ed");
                }
            }
        } catch (error) {
            /* almacenamiento bloqueado: se usa el tema por defecto */
        }
    })();
</script>
</head>

<body class="page-explorar">

<a class="skip-link" href="#contenido">Saltar al contenido</a>


<header class="site-header" id="site-header">

    <a href="index.html" class="logo" aria-label="Códice — Inicio">

        <span class="logo-symbol" aria-hidden="true">

            <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">

                <path d="M20 5V32" />
                <path d="M13 9H27" />
                <path d="M20 5L17.5 9H22.5L20 5Z" />
                <path d="M13 9L7 22H19L13 9Z" />
                <path d="M27 9L21 22H33L27 9Z" />
                <path d="M5 22C6 24 10 25 13 25C16 25 20 24 21 22" />
                <path d="M19 22C20 24 24 25 27 25C30 25 34 24 35 22" />
                <path d="M15 32H25" />

            </svg>

        </span>

        <span class="logo-text">

            <span class="logo-main">
                CÓDICE
            </span>

            <span class="logo-sub">
                ARCHIVO DE CONOCIMIENTO
            </span>

        </span>

    </a>


    <!-- Acciones de la cabecera en móvil (en escritorio quedan ocultas) -->
    <div class="header-actions">

        <button
            class="header-icon-btn"
            type="button"
            id="search-shortcut"
            aria-label="Buscar"
            aria-expanded="false"
            aria-controls="mobile-search"
        >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="M15.5 15.5L21 21" />
            </svg>
        </button>

        <button
            class="header-icon-btn menu-toggle"
            type="button"
            id="menu-toggle"
            aria-label="Menú"
            aria-expanded="false"
            aria-controls="site-nav"
        >
            <span class="menu-icon" aria-hidden="true"></span>
        </button>

    </div>


    <nav class="navigation" id="site-nav" aria-label="Navegación principal">

        <a href="index.html">
            Inicio
        </a>

        <a href="explorar.html" class="active" aria-current="page">
            Explorar
        </a>

        <a href="colecciones.html">
            Colecciones
        </a>

        <a href="autores.html">
            Autores
        </a>

        <a href="temas.html">
            Temas
        </a>

        <a href="silabos.html">
            Sílabos
        </a>


        <form
            class="header-search"
            action="buscar.html"
            method="GET"
            role="search"
        >

            <label
                for="header-search-input"
                class="visually-hidden"
            >
                Buscar en Códice
            </label>

            <input
                id="header-search-input"
                type="search"
                name="q"
                placeholder="Buscar..."
                autocomplete="off"
            >

            <button
                type="submit"
                aria-label="Buscar"
            >
                →
            </button>

        </form>


        <button
            class="theme-toggle"
            type="button"
            aria-label="Modo claro"
            aria-pressed="false"
        >

            <span class="theme-toggle-text" aria-hidden="true">Apariencia</span>

            <span class="theme-toggle-state" aria-hidden="true">Oscuro</span>

            <span
                class="theme-toggle-icon"
                aria-hidden="true"
            >
                ◐
            </span>

        </button>

    </nav>


    <!-- Barra de búsqueda desplegable (solo móvil) -->
    <form
        class="mobile-search"
        id="mobile-search"
        action="buscar.html"
        method="GET"
        role="search"
        hidden
    >

        <label for="mobile-search-input" class="visually-hidden">
            Buscar en Códice
        </label>

        <input
            id="mobile-search-input"
            type="search"
            name="q"
            placeholder="Autor, obra o tema…"
            autocomplete="off"
            enterkeyhint="search"
        >

        <button type="submit" aria-label="Buscar">→</button>

    </form>

</header>

    <main id="contenido" tabindex="-1">

        <section class="section">

            <div class="section-header">

                <div>

                    <p class="eyebrow" id="explorar-tipo">
                        ARCHIVO
                    </p>

                    <h1 id="explorar-titulo" class="visually-hidden">
                        Obras
                    </h1>

                    <p class="section-note" id="explorar-descripcion"></p>

                </div>

                <div class="catalog-filter">

                    <label
                        for="explorar-filtro-tipo"
                        class="catalog-filter-label"
                    >
                        Tipo
                    </label>

                    <span class="catalog-filter-control">

                        <select
                            id="explorar-filtro-tipo"
                            class="catalog-filter-select"
                        >
                            <option value="">Todos</option>
                        </select>

                        <span
                            class="catalog-filter-caret"
                            aria-hidden="true"
                        >
                            ▾
                        </span>

                    </span>

                </div>

            </div>


            <div class="catalog-toolbar">

                <div class="view-toggle" role="group" aria-label="Vista del catálogo">

                    <button type="button" data-vista="lista" aria-pressed="true" aria-label="Vista de lista">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>

                    <button type="button" data-vista="cuadricula" aria-pressed="false" aria-label="Vista de cuadrícula">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/></svg>
                    </button>

                </div>

                <button
                    type="button"
                    class="catalog-density-toggle"
                    id="explorar-densidad"
                    aria-pressed="false"
                >

                    <span class="catalog-density-arrows">
                        <span>←</span><span>→</span>
                    </span>

                    <span class="catalog-density-label">
                        <span class="catalog-density-label-expand">
                            Agrandar
                        </span>
                        <span class="catalog-density-label-reduce">
                            Reducir
                        </span>
                    </span>

                </button>

            </div>


            <div class="featured-grid" id="biblioteca">

            </div>

        </section>

    </main>


    <footer>

    <div class="footer-brand">

        <span>
            CÓDICE
        </span>

        <small>
            Archivo de conocimiento
        </small>

    </div>

    <div class="footer-domain">
        Derecho · Política · Humanidades
    </div>

</footer>


    <script src="js/app.js"></script>

</body>

</html>
