<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0c">
    <meta name="color-scheme" content="dark light">

    <title>Buscar — Códice</title>

    <link rel="stylesheet" href="css/estilo.css">
   
    <script>
    (function () {
        try {
            var tema = localStorage.getItem("codice-theme");

            if (tema === "light") {
                document.documentElement.setAttribute("data-theme", "light");

                var meta = document.querySelector('meta[name="theme-color"]');

                if (meta) {
                    meta.setAttribute("content", "#f7f4ed");
                }
            }
        } catch (error) {
            /* almacenamiento bloqueado: se usa el tema por defecto */
        }
    })();
</script>

</head>

    <!-- Acciones de la cabecera en móvil (en escritorio quedan ocultas) -->

        <button
            class="header-icon-btn"
            type="button"
            id="search-shortcut"
            aria-label="Buscar"
            aria-expanded="false"
            aria-controls="mobile-search"
        >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="M15.5 15.5L21 21" />
            </svg>
        </button>

        <button
            class="header-icon-btn menu-toggle"
            type="button"
            id="menu-toggle"
            aria-label="Menú"
            aria-expanded="false"
            aria-controls="site-nav"
        >
            <span class="menu-icon" aria-hidden="true"></span>
        </button>

    </div>


    <nav class="navigation" id="site-nav" aria-label="Navegación principal">

        <a href="temas.html">

        </a>


        <form
            class="header-search"
            action="buscar.html"
            method="GET"
            role="search"
        >

            <label
                for="header-search-input"
                class="visually-hidden"
            >
                Buscar en Códice
            </label>

            <input
                id="header-search-input"
                type="search"
                name="q"
                placeholder="Buscar..."
                autocomplete="off"
            >

            <button
                type="submit"
                aria-label="Buscar"
            >
                →
            </button>

        </form>


        <button
            class="theme-toggle"
            type="button"
            aria-label="Modo claro"
            aria-pressed="false"

            <span class="theme-toggle-text" aria-hidden="true">Apariencia</span>

            <span
                class="theme-toggle-icon"
                aria-hidden="true"
            >
                ◐
            </span>

        </button>

    <!-- Barra de búsqueda desplegable (solo móvil) -->
    <form
        class="mobile-search"
        id="mobile-search"
        action="buscar.html"
        method="GET"
        role="search"
        hidden
    >

        <label for="mobile-search-input" class="visually-hidden">
            Buscar en Códice
        </label>

        <input
            id="mobile-search-input"
            type="search"
            name="q"
            placeholder="Autor, obra o tema…"
            autocomplete="off"
            enterkeyhint="search"
        >

        <button type="submit" aria-label="Buscar">→</button>

    </form>

</header>


    <main id="contenido" tabindex="-1">

        <section class="section">

            <div class="section-header">

                <div>

                    <p class="eyebrow">
                        BÚSQUEDA
                    </p>

                    <h1 id="busqueda-titulo">
                        Resultados
                    </h1>

                    <p
                        class="section-note"
                        id="busqueda-descripcion"
                        aria-live="polite"
                    >
                        Obras encontradas en el archivo de Códice.
                    </p>

                </div>

            </div>


            <form
                class="search-console"
                id="buscar-form"
                action="buscar.html"
                method="GET"
                role="search"
            >

                <div class="search-console-bar">

                    <label
                        for="buscar-q"
                        class="visually-hidden"
                    >
                        Buscar en CÓDICE
                    </label>

                    <input
                        id="buscar-q"
                        name="q"
                        type="search"
                        placeholder="Buscar en CÓDICE"
                        autocomplete="off"
                    >

                    <button
                        type="submit"
                        aria-label="Buscar"
                    >
                        →
                    </button>

                </div>

                <div class="search-console-aux">

                    <button
                        type="button"
                        class="search-advanced-toggle"
                        id="buscar-avanzada-toggle"
                        aria-expanded="false"
                        aria-controls="buscar-avanzada"
                    >
                        <span
                            class="search-advanced-sign"
                            aria-hidden="true"
                        >+</span>
                        Búsqueda avanzada
                    </button>

                    <button
                        type="button"
                        class="search-clear"
                        id="buscar-limpiar"
                        hidden
                    >
                        Quitar criterios
                    </button>

                </div>

                <div
                    class="search-advanced"
                    id="buscar-avanzada"
                >

                    <div class="search-advanced-inner">

                        <div
                            class="search-fields"
                            id="buscar-campos"
                        ></div>

                        <div
                            class="search-extra"
                            id="buscar-extra"
                        ></div>

                    </div>

                </div>

                <ul
                    class="search-chips"
                    id="buscar-chips"
                    aria-label="Criterios activos"
                ></ul>

            </form>

            <div class="catalog-toolbar catalog-toolbar--view">

                <div class="view-toggle" role="group" aria-label="Vista del catálogo">

                    <button type="button" data-vista="lista" aria-pressed="true" aria-label="Vista de lista">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>

                    <button type="button" data-vista="cuadricula" aria-pressed="false" aria-label="Vista de cuadrícula">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/></svg>
                    </button>

                </div>

            </div>

            <div class="featured-grid" id="biblioteca">

            </div>

        </section>

    </main>
